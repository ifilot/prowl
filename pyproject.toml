[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "prowl-dft"
version = "0.1.0"
description = "Open VASP -> localized-orbital bonding analysis (COHP, COOP, pDOS, charges) with PAW projection and CUDA"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "h5py>=3.8", "pyyaml>=6", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10", "mpmath>=1.3"]

[project.scripts]
prowl = "prowl.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/prowl"]
cmake.define = {PROWL_BUILD_TESTS = "OFF", PROWL_BUILD_PYTHON = "ON"}

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
