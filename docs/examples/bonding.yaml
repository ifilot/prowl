# Starting configuration; adapt the bond cutoff and energy range to your system.
schema_version: 1
profile: prowl

basis:
  source: koga_hf_sto
  selection: zval_valence
  polarization: none

analysis:
  bond_selection:
    mode: distance_cutoff
    min_distance_angstrom: 0.0
    max_distance_angstrom: 3.0
  energy:
    reference: fermi
    min_ev: -20.0
    max_ev: 10.0
    points: 3001
    broadening:
      type: gaussian
      sigma_ev: 0.05
  window_sensitivity: true

numerical:
  backend: auto
  band_window: auto
  strict_validation: true

output:
  path: bonding.h5
