name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake catch2 libeigen3-dev libopenblas-dev nlohmann-json3-dev

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          requirements = (
              metadata["build-system"]["requires"]
              + metadata["project"]["dependencies"]
              + metadata["project"]["optional-dependencies"]["test"]
          )
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: Configure CPU build
        run: >-
          cmake --preset cpu-release
          -DPython_EXECUTABLE="$(command -v python)"
          -DPROWL_NATIVE_ARCH=OFF

      - name: Compile core, Python extension and C++ tests
        run: cmake --build --preset cpu-release --parallel 2

      - name: Run C++ tests
        run: ctest --preset cpu-release --parallel 2 --no-tests=error

      - name: Run Python tests
        run: python -m pytest -ra
